<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>눈 운동 가이드 - Eye Exercise Guide</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 24px;
      text-align: center;
    }

    header {
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      background: rgba(37, 99, 235, 0.2);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 16px;
    }

    /* 탭 내비게이션 */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      background: var(--bg-card);
      color: var(--text-sub);
      border: 1px solid #334155;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    /* 메인 스테이지 (운동 & 게임 영역) */
    .stage-wrapper {
      background: var(--bg-card);
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .stage {
      width: 100%;
      height: 440px;
      background: #0b1120;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1e293b;
    }

    /* 안구 운동 타겟 원 */
    .eye-target {
      width: 44px;
      height: 44px;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb);
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 24px rgba(59, 130, 246, 0.8), inset 0 0 8px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s linear;
    }

    .eye-target::after {
      content: '';
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
    }

    /* 미니게임 타겟 */
    .game-target {
      width: 56px;
      height: 56px;
      background: radial-gradient(circle at 30% 30%, #34d399, #059669);
      border-radius: 50%;
      position: absolute;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
      user-select: none;
      transition: transform 0.1s;
    }

    .game-target:active {
      transform: scale(0.9);
    }

    /* 컨트롤 패널 */
    .controls {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .status-info {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 16px;
      font-weight: 600;
    }

    .status-badge {
      background: #0f172a;
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      color: var(--accent);
    }

    .action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn:hover {
      background: var(--primary-hover);
    }

    .action-btn.stop {
      background: #ef4444;
    }

    .action-btn.stop:hover {
      background: #dc2626;
    }

    /* 안내 오버레이 */
    .overlay-msg {
      text-align: center;
      padding: 24px;
      max-width: 420px;
    }

    .overlay-msg i {
      font-size: 48px;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .overlay-msg h3 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .overlay-msg p {
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.5;
    }

    /* 칭찬 모달 */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-backdrop.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid #3b82f6;
      border-radius: 24px;
      padding: 40px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .trophy-icon {
      width: 80px;
      height: 80px;
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 20px;
    }

    .modal-card h2 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .modal-card p {
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">7차시 프로젝트 · 박동화</div>
      <h1>눈 운동 가이드</h1>
      <p class="subtitle">스마트폰과 모니터로 지친 눈을 위한 30초 시력 보호 트레이닝</p>
    </header>

    <!-- 기능 선택 탭 -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-exercise" onclick="switchMode('exercise')">
        <i class="fa-solid fa-eye"></i> 1. 동적 원 안구 운동
      </button>
      <button class="tab-btn" id="tab-game" onclick="switchMode('game')">
        <i class="fa-solid fa-gamepad"></i> 2. 시선 집중 미니게임
      </button>
    </div>

    <!-- 메인 스테이지 -->
    <div class="stage-wrapper">
      <div class="stage" id="stage">
        <!-- 초기 안내 화면 -->
        <div class="overlay-msg" id="guide-overlay">
          <i class="fa-solid fa-circle-dot" id="guide-icon"></i>
          <h3 id="guide-title">상하좌우 & 원형 안구 운동</h3>
          <p id="guide-desc">고개는 고정한 채, 화면에서 움직이는 파란색 원을 눈동자로만 끝까지 따라가세요.</p>
        </div>
      </div>

      <!-- 하단 컨트롤 바 -->
      <div class="controls">
        <div class="status-info">
          <div class="status-badge" id="step-label">대기 중</div>
          <div id="timer-display">남은 시간: <strong>20초</strong></div>
        </div>
        <button class="action-btn" id="start-btn" onclick="toggleSession()">
          <i class="fa-solid fa-play"></i> 운동 시작하기
        </button>
      </div>
    </div>
  </div>

  <!-- 운동 완료 칭찬 모달 -->
  <div class="modal-backdrop" id="praise-modal">
    <div class="modal-card">
      <div class="trophy-icon">
        <i class="fa-solid fa-award"></i>
      </div>
      <h2 id="praise-title">정말 훌륭해요! 👏</h2>
      <p id="praise-text">
        눈 운동을 성공적으로 완료했습니다.<br>
        꾸준한 습관이 맑고 건강한 시력을 지킵니다!
      </p>
      <button class="action-btn" style="margin: 0 auto;" onclick="closeModal()">
        <i class="fa-solid fa-check"></i> 확인
      </button>
    </div>
  </div>

  <script>
    let currentMode = 'exercise'; // 'exercise' or 'game'
    let isRunning = false;
    let animationFrameId = null;
    let timerInterval = null;
    let timeLeft = 20;
    let score = 0;

    const stage = document.getElementById('stage');
    const guideOverlay = document.getElementById('guide-overlay');
    const guideIcon = document.getElementById('guide-icon');
    const guideTitle = document.getElementById('guide-title');
    const guideDesc = document.getElementById('guide-desc');
    const stepLabel = document.getElementById('step-label');
    const timerDisplay = document.getElementById('timer-display');
    const startBtn = document.getElementById('start-btn');
    const praiseModal = document.getElementById('praise-modal');

    // 모드 전환
    function switchMode(mode) {
      if (isRunning) stopSession();
      currentMode = mode;

      document.getElementById('tab-exercise').classList.toggle('active', mode === 'exercise');
      document.getElementById('tab-game').classList.toggle('active', mode === 'game');

      if (mode === 'exercise') {
        guideIcon.className = 'fa-solid fa-circle-dot';
        guideTitle.textContent = '상하좌우 & 원형 안구 운동';
        guideDesc.textContent = '고개는 고정한 채, 화면에서 움직이는 파란색 원을 눈동자로만 끝까지 따라가세요.';
        stepLabel.textContent = '안구 스트레칭';
        timerDisplay.innerHTML = '남은 시간: <strong>20초</strong>';
        startBtn.innerHTML = '<i class="fa-solid fa-play"></i> 운동 시작하기';
      } else {
        guideIcon.className = 'fa-solid fa-bullseye';
        guideTitle.textContent = '반짝이는 타겟 잡기 미니게임';
        guideDesc.textContent = '화면 곳곳에 나타나는 초록색 타겟을 빠르게 찾아 클릭하세요! 초점 조절 능력을 키워줍니다.';
        stepLabel.textContent = '점수: 0점';
        timerDisplay.innerHTML = '남은 시간: <strong>15초</strong>';
        startBtn.innerHTML = '<i class="fa-solid fa-play"></i> 게임 시작하기';
      }
    }

    // 시작 / 정지 토글
    function toggleSession() {
      if (isRunning) {
        stopSession();
      } else {
        startSession();
      }
    }

    // 세션 시작
    function startSession() {
      isRunning = true;
      guideOverlay.style.display = 'none';
      startBtn.classList.add('stop');
      startBtn.innerHTML = '<i class="fa-solid fa-stop"></i> 중단하기';

      if (currentMode === 'exercise') {
        startEyeExercise();
      } else {
        startMiniGame();
      }
    }

    // 세션 중단 및 초기화
    function stopSession() {
      isRunning = false;
      cancelAnimationFrame(animationFrameId);
      clearInterval(timerInterval);

      // 스테이지 내 동적 요소 제거
      const targets = stage.querySelectorAll('.eye-target, .game-target');
      targets.forEach(el => el.remove());

      guideOverlay.style.display = 'block';
      startBtn.classList.remove('stop');
      switchMode(currentMode);
    }

    // 1. 핵심 기능 ①: 상하 좌우 원 운동
    function startEyeExercise() {
      timeLeft = 20;
      timerDisplay.innerHTML = `남은 시간: <strong>${timeLeft}초</strong>`;

      const target = document.createElement('div');
      target.className = 'eye-target';
      stage.appendChild(target);

      const startTime = performance.now();

      function animate(now) {
        if (!isRunning) return;
        const elapsed = (now - startTime) / 1000; // 초 단위 경과 시간

        const stageW = stage.clientWidth;
        const stageH = stage.clientHeight;
        const centerX = stageW / 2 - 22;
        const centerY = stageH / 2 - 22;
        const rangeX = stageW * 0.38;
        const rangeY = stageH * 0.35;

        let x = centerX;
        let y = centerY;

        if (elapsed < 6) {
          // 0~6초: 좌우 운동
          stepLabel.textContent = '1단계: 좌우 시선 이동';
          x = centerX + Math.sin(elapsed * 2.5) * rangeX;
        } else if (elapsed < 12) {
          // 6~12초: 상하 운동
          stepLabel.textContent = '2단계: 상하 시선 이동';
          y = centerY + Math.sin((elapsed - 6) * 2.5) * rangeY;
        } else {
          // 12~20초: 큰 원 그리기
          stepLabel.textContent = '3단계: 크게 원 그리기';
          const angle = (elapsed - 12) * 2.2;
          x = centerX + Math.cos(angle) * rangeX * 0.85;
          y = centerY + Math.sin(angle) * rangeY * 0.85;
        }

        target.style.left = `${x}px`;
        target.style.top = `${y}px`;

        animationFrameId = requestAnimationFrame(animate);
      }

      animationFrameId = requestAnimationFrame(animate);

      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.innerHTML = `남은 시간: <strong>${timeLeft}초</strong>`;

        if (timeLeft <= 0) {
          completeSession('exercise');
        }
      }, 1000);
    }

    // 2. 핵심 기능 ②: 간단한 미니게임
    function startMiniGame() {
      timeLeft = 15;
      score = 0;
      stepLabel.textContent = `점수: ${score}점`;
      timerDisplay.innerHTML = `남은 시간: <strong>${timeLeft}초</strong>`;

      spawnGameTarget();

      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.innerHTML = `남은 시간: <strong>${timeLeft}초</strong>`;

        if (timeLeft <= 0) {
          completeSession('game');
        }
      }, 1000);
    }

    function spawnGameTarget() {
      if (!isRunning) return;
      const existing = stage.querySelector('.game-target');
      if (existing) existing.remove();

      const target = document.createElement('div');
      target.className = 'game-target';
      target.innerHTML = '<i class="fa-solid fa-eye"></i>';

      const maxX = stage.clientWidth - 76;
      const maxY = stage.clientHeight - 76;
      const randomX = Math.floor(Math.random() * maxX) + 10;
      const randomY = Math.floor(Math.random() * maxY) + 10;

      target.style.left = `${randomX}px`;
      target.style.top = `${randomY}px`;

      target.onclick = () => {
        score += 10;
        stepLabel.textContent = `점수: ${score}점`;
        spawnGameTarget();
      };

      stage.appendChild(target);
    }

    // 3. 핵심 기능 ③: 운동 완료 후 칭찬 시스템
    function completeSession(mode) {
      stopSession();

      const praiseTitle = document.getElementById('praise-title');
      const praiseText = document.getElementById('praise-text');

      if (mode === 'exercise') {
        praiseTitle.textContent = '최고예요! 눈의 피로가 싹 풀렸어요 ✨';
        praiseText.innerHTML = '20초 동안 안구 운동을 완벽하게 해내셨습니다.<br>오늘도 건강한 시력을 잘 지켜내셨네요!';
      } else {
        praiseTitle.textContent = `대단해요! 최종 점수 ${score}점 달성! 🎉`;
        praiseText.innerHTML = '빠른 시선 이동과 집중력이 정말 뛰어납니다.<br>잠시 먼 곳을 바라보며 눈을 편안히 쉬게 해주세요!';
      }

      praiseModal.classList.add('show');
    }

    function closeModal() {
      praiseModal.classList.remove('show');
    }
  </script>
</body>
</html>
