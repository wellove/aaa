<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도시별 실시간 날씨 지도 (Leaflet.js)</title>
    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f9f9f9;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .notice {
            background-color: #e8f4f8;
            color: #2980b9;
            padding: 10px 15px;
            text-align: center;
            font-size: 14px;
            border-bottom: 1px solid #d4e6f1;
        }
        #map {
            width: 100%;
            height: calc(100vh - 115px);
        }
        .weather-popup {
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <h2>국내 주요 도시 실시간 날씨 지도</h2>
    </header>
    
    <div class="notice">
        ※ 마커를 클릭하면 OpenWeatherMap API를 통해 실시간 날씨 정보를 불러옵니다. (API Key 입력 필요)
    </div>
    
    <div id="map"></div>

    <!-- Leaflet JS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // OpenWeatherMap API Key 설정 (본인의 키를 입력하세요)
        const OPENWEATHER_API_KEY = 'f738d53ea69e7fdd825364d81d17af21';

        // 지도 초기화 (대한민국 중심 좌표 기준)
        var map = L.map('map').setView([36.5, 127.5], 7);

        // OpenStreetMap 타일 레이어 추가
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 도시 목록 배열 (이름, 위도, 경도)
        const cities = [
            { name: '서울', lat: 37.5665, lon: 126.9780 },
            { name: '부산', lat: 35.1796, lon: 129.0756 },
            { name: '장흥 (장흥안양중 인근)', lat: 34.6530, lon: 126.9738 },
            { name: '제주', lat: 33.4996, lon: 126.5312 },
            { name: '강릉', lat: 37.7519, lon: 128.8761 },
            { name: '전주', lat: 35.8242, lon: 127.1480 }
        ];

        // 각 도시별 마커 생성 및 이벤트 등록
        cities.forEach(city => {
            var marker = L.marker([city.lat, city.lon]).addTo(map);

            // 초기 팝업 내용 설정 (클릭 유도 메시지)
            marker.bindPopup(`<b>${city.name}</b><br>마커를 클릭하여 날씨를 확인하세요.`);

            // 마커 클릭 이벤트 리스너
            marker.on('click', async () => {
                if (OPENWEATHER_API_KEY === 'YOUR_OPENWEATHERMAP_API_KEY') {
                    marker.setPopupContent(`
                        <div class="weather-popup">
                            <b>${city.name}</b><br>
                            <span style="color: red;">API Key가 설정되지 않았습니다.<br>코드를 수정하여 키를 입력해주세요.</span>
                        </div>
                    `);
                    return;
                }

                // 로딩 상태 표시
                marker.setPopupContent(`<b>${city.name}</b><br>날씨 정보를 불러오는 중...`);

                try {
                    // OpenWeatherMap 현재 날씨 API 호출 (섭씨 단위, 한국어 설명)
                    const url = `https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lon}&appid=${OPENWEATHER_API_KEY}&units=metric&lang=kr`;
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error('날씨 데이터를 불러오는데 실패했습니다.');
                    }

                    const data = await response.json();
                    
                    const temp = data.main.temp;
                    const feelsLike = data.main.feels_like;
                    const desc = data.weather[0].description;
                    const humidity = data.main.humidity;
                    const windSpeed = data.wind.speed;
                    const iconCode = data.weather[0].icon;
                    const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

                    // 날씨 정보 HTML 구성
                    const popupContent = `
                        <div class="weather-popup" style="text-align: center;">
                            <b style="font-size: 16px;">${city.name}</b><br>
                            <img src="${iconUrl}" alt="날씨 아이콘" style="width: 50px; height: 50px; margin: -10px 0;"><br>
                            <span style="font-size: 15px; text-transform: capitalize;"><b>${desc}</b></span><br>
                            온도: <b>${temp}°C</b> (체감: ${feelsLike}°C)<br>
                            습도: ${humidity}% | 풍속: ${windSpeed} m/s
                        </div>
                    `;
                    marker.setPopupContent(popupContent);

                } catch (error) {
                    marker.setPopupContent(`
                        <div class="weather-popup">
                            <b>${city.name}</b><br>
                            <span style="color: red;">날씨 정보를 가져오지 못했습니다.</span>
                        </div>
                    `);
                    console.error(error);
                }
            });
        });
    </script>
</body>
</html>
